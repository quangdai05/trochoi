<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quangdai dev web</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --wood-dark: #2b211a;
    --wood-mid: #463e34;
    --wood-light: #5e5242;
    --brass: #b8a481;
    --brass-light: #dacbaa;
    --paper: #f2e6d2;
    --ink: #1e1a17;
    --red: #8b2e2e;
    --green: #3a6b3a;
  }

  html, body {
    min-height: 100vh;
    font-family: 'VT323', monospace;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
    overflow-x: hidden;
  }

  body {
    background: #0f0d0a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    position: relative;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ============================================================
     🖼️ BACKGROUND.PNG VỚI BLUR
     ============================================================ */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .bg-layer::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, #2a1f3a 0%, #7a3f45 40%, #b85540 70%, #1a1613 100%);
  }

  .bg-image {
    position: absolute;
    inset: -40px;
    width: calc(100% + 80px);
    height: calc(100% + 80px);
    object-fit: cover;
    object-position: center;
    filter: blur(8px) brightness(0.5) saturate(1.1);
    transform: scale(1.08);
    animation: bgPan 30s ease-in-out infinite alternate;
  }

  @keyframes bgPan {
    0%   { transform: scale(1.08) translate(0, 0); }
    100% { transform: scale(1.12) translate(-15px, -10px); }
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.55) 90%),
      linear-gradient(180deg, rgba(15, 13, 10, 0.35) 0%, rgba(15, 13, 10, 0.7) 100%);
    mix-blend-mode: multiply;
  }

  .bg-blur {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg,
        rgba(184, 164, 129, 0.035) 0px, rgba(184, 164, 129, 0.035) 1px,
        transparent 1px, transparent 3px);
    pointer-events: none;
    opacity: 0.6;
  }

  /* ============================================================
     🌟 SAO TRỜI
     ============================================================ */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .stars.active { opacity: 1; }

  .star {
    position: absolute;
    background: #fff;
    box-shadow: 0 0 6px #fff, 0 0 12px #ffe9b8;
    animation: twinkle 2s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 1; transform: scale(1.3); }
  }

  /* ============================================================
     🍃 LÁ RƠI
     ============================================================ */
  .leaves {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }

  .leaf {
    position: absolute;
    background: #b85540;
    top: -20px;
    clip-path: polygon(50% 0%, 100% 30%, 90% 70%, 50% 100%, 10% 70%, 0% 30%);
    box-shadow: inset -1px -2px 0 rgba(0,0,0,0.3);
    animation: leafFall linear infinite;
  }

  .leaf.c1 { background: #b85540; }
  .leaf.c2 { background: #d87840; }
  .leaf.c3 { background: #8b6a3a; }
  .leaf.c4 { background: #6a4a2a; }
  .leaf.c5 { background: #c89860; }

  @keyframes leafFall {
    0%   { transform: translateY(-30px) translateX(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translateY(50vh) translateX(60px) rotate(360deg); }
    100% { transform: translateY(110vh) translateX(-40px) rotate(720deg); opacity: 0.7; }
  }

  /* ============================================================
     ✨ ĐOM ĐÓM
     ============================================================ */
  .fireflies {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    overflow: hidden;
  }

  .firefly {
    position: absolute;
    background: #ffe9a0;
    border-radius: 50%;
    box-shadow: 0 0 8px #ffe9a0, 0 0 16px #ffb850;
    animation: fireflyFloat linear infinite;
    opacity: 0;
  }

  @keyframes fireflyFloat {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: 0.9; }
    40%  { transform: translate(40px, -60px); opacity: 0.4; }
    70%  { transform: translate(-30px, -120px); opacity: 0.8; }
    100% { transform: translate(20px, -180px); opacity: 0; }
  }

  /* ============================================================
     🏮 ĐÈN LỒNG
     ============================================================ */
  .lantern-wrap {
    position: fixed;
    top: 10vh;
    z-index: 7;
    pointer-events: none;
    animation: lanternSway 5s ease-in-out infinite alternate;
  }
  .lantern-wrap.left  { left: 3vw; }
  .lantern-wrap.right { right: 3vw; animation-delay: -2s; }

  .lantern-rope {
    width: 2px; height: 70px;
    background: linear-gradient(180deg, #2b211a, #5e4e3a);
    margin: 0 auto;
  }

  .lantern {
    width: 36px; height: 52px;
    background: linear-gradient(180deg, #d84040, #a02020 60%, #701010);
    border: 3px solid #4a1010;
    border-radius: 6px / 14px;
    box-shadow:
      inset -4px 0 0 rgba(255, 220, 150, 0.3),
      inset 4px 0 0 rgba(255, 220, 150, 0.3),
      0 0 20px rgba(255, 150, 80, 0.5),
      0 0 40px rgba(255, 100, 40, 0.25);
    position: relative;
    animation: lanternGlow 2.5s ease-in-out infinite;
  }

  .lantern::before {
    content: "";
    position: absolute;
    top: -6px; left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 6px;
    background: #b8a481;
    border: 2px solid #2b211a;
  }

  .lantern::after {
    content: "福";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ffe9a0;
    font-family: 'VT323', monospace;
    font-size: 20px;
    text-shadow: 0 0 6px #ffb850;
  }

  @keyframes lanternSway {
    0%   { transform: rotate(-4deg); }
    100% { transform: rotate(4deg); }
  }

  @keyframes lanternGlow {
    0%, 100% {
      box-shadow:
        inset -4px 0 0 rgba(255, 220, 150, 0.3),
        inset 4px 0 0 rgba(255, 220, 150, 0.3),
        0 0 20px rgba(255, 150, 80, 0.5),
        0 0 40px rgba(255, 100, 40, 0.25);
    }
    50% {
      box-shadow:
        inset -4px 0 0 rgba(255, 240, 180, 0.5),
        inset 4px 0 0 rgba(255, 240, 180, 0.5),
        0 0 30px rgba(255, 170, 90, 0.8),
        0 0 60px rgba(255, 120, 50, 0.4);
    }
  }

  /* ============================================================
     🎋 CÀNH TRÚC
     ============================================================ */
  .bamboo {
    position: fixed;
    z-index: 8;
    pointer-events: none;
    opacity: 0.75;
  }
  .bamboo.left  { top: -20px; left: -10px;  transform: rotate(-12deg); }
  .bamboo.right { top: -20px; right: -10px; transform: rotate(12deg) scaleX(-1); }

  .bamboo-stalk {
    position: relative;
    width: 8px; height: 200px;
    background: linear-gradient(90deg, #2a3a20, #4a6a30 40%, #6a8a40 60%, #2a3a20);
    box-shadow: inset -2px 0 0 rgba(0,0,0,0.3), inset 2px 0 0 rgba(255,255,255,0.1);
  }

  .bamboo-stalk::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px, transparent 40px,
      rgba(0,0,0,0.4) 40px, rgba(0,0,0,0.4) 44px);
  }

  .bamboo-leaf {
    position: absolute;
    width: 40px; height: 8px;
    background: linear-gradient(90deg, #4a6a30, #6a8a40);
    clip-path: polygon(0% 50%, 30% 0%, 100% 30%, 100% 70%, 30% 100%);
    transform-origin: 0% 50%;
  }

  .bamboo-leaf.l1 { top: 30px;  left: 6px; transform: rotate(30deg); }
  .bamboo-leaf.l2 { top: 60px;  left: 6px; transform: rotate(-25deg) scaleX(-1); }
  .bamboo-leaf.l3 { top: 100px; left: 6px; transform: rotate(45deg); }
  .bamboo-leaf.l4 { top: 130px; left: 6px; transform: rotate(-15deg) scaleX(-1); }
  .bamboo-leaf.l5 { top: 160px; left: 6px; transform: rotate(20deg); }

  /* ============================================================
     🎬 SCREEN SHAKE
     ============================================================ */
  body.shake {
    animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97);
  }

  @keyframes screenShake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }

  /* ============================================================
     🏯 KHUNG GAME
     ============================================================ */
  .game-wrapper {
    max-width: 860px;
    width: 100%;
    position: relative;
    z-index: 20;
    background:
      repeating-linear-gradient(90deg, var(--wood-light) 0px, var(--wood-light) 4px, var(--wood-mid) 4px, var(--wood-mid) 8px),
      repeating-linear-gradient(0deg, #73634c 0px, #73634c 2px, var(--wood-light) 2px, var(--wood-light) 6px);
    background-blend-mode: overlay;
    border: 6px solid var(--wood-dark);
    box-shadow:
      0 0 0 4px var(--brass),
      0 0 0 10px var(--wood-dark),
      0 14px 0 0 #0a0806,
      0 18px 40px rgba(0,0,0,0.95),
      0 25px 80px rgba(0,0,0,0.8),
      inset 0 0 80px rgba(0,0,0,0.4);
    padding: 28px 26px 26px;
    animation: wrapperIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  @keyframes wrapperIn {
    from { opacity: 0; transform: scale(0.9) translateY(30px); filter: blur(4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  /* Ánh sáng quét qua khung khi chuyển câu */
  .game-wrapper::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 80%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent, rgba(255, 220, 150, 0.15),
      rgba(255, 240, 200, 0.25), rgba(255, 220, 150, 0.15), transparent);
    pointer-events: none;
    z-index: 1;
    animation: lightSweep 8s ease-in-out infinite;
  }

  @keyframes lightSweep {
    0%, 80%, 100% { left: -100%; }
    40%           { left: 120%; }
  }

  /* 4 góc trống đồng */
  .game-wrapper::after {
    content: "";
    position: absolute;
    width: 46px; height: 46px;
    top: -32px; right: -32px;
    background:
      radial-gradient(circle, transparent 30%, var(--brass) 31%, var(--brass) 38%, transparent 39%),
      radial-gradient(circle, var(--brass) 6%, transparent 7%);
    background-size: 100% 100%, 40% 40%;
    background-position: center, center;
    background-repeat: no-repeat;
    opacity: 0.55;
    pointer-events: none;
    transform: rotate(-20deg);
  }

  /* ============================================================
     📊 PROGRESS BAR
     ============================================================ */
  .progress-bar {
    position: absolute;
    top: 4px; left: 12px; right: 12px;
    height: 6px;
    background: rgba(15, 13, 10, 0.6);
    border: 2px solid var(--brass);
    z-index: 25;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #9fdf9f, #6faf5f);
    width: 0%;
    transition: width 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 0 8px rgba(159, 223, 159, 0.6);
    position: relative;
  }

  .progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg,
      transparent 0px, transparent 6px,
      rgba(255,255,255,0.2) 6px, rgba(255,255,255,0.2) 7px);
  }

  /* ============================================================
     🌟 COMBO STREAK
     ============================================================ */
  .combo-badge {
    position: absolute;
    top: 20px; right: 20px;
    padding: 4px 12px;
    background: linear-gradient(135deg, #ff7a2e, #d84040);
    border: 3px solid #fff;
    color: #fff;
    font-size: 22px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #4a1010;
    box-shadow: 0 0 20px rgba(255, 120, 40, 0.8), 0 4px 0 #2a0a0a;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 30;
    pointer-events: none;
    animation: comboFlame 0.8s ease-in-out infinite alternate;
  }

  .combo-badge.show {
    opacity: 1;
    transform: scale(1);
  }

  @keyframes comboFlame {
    0%   { box-shadow: 0 0 20px rgba(255, 120, 40, 0.8), 0 4px 0 #2a0a0a; }
    100% { box-shadow: 0 0 35px rgba(255, 180, 60, 1), 0 4px 0 #2a0a0a; }
  }

  /* ============================================================
     💥 ĐIỂM BAY LÊN (+1 / -1)
     ============================================================ */
  .score-pop {
    position: fixed;
    font-size: 36px;
    font-family: 'VT323', monospace;
    font-weight: bold;
    pointer-events: none;
    z-index: 100;
    text-shadow: 2px 2px 0 #000, 0 0 16px currentColor;
    animation: scoreFloat 1.2s ease-out forwards;
  }

  .score-pop.plus  { color: #9fdf9f; }
  .score-pop.minus { color: #ff8080; }

  @keyframes scoreFloat {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
    20%  { opacity: 1; transform: translate(-50%, -20px) scale(1.3); }
    60%  { opacity: 1; transform: translate(-50%, -60px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -120px) scale(0.9); }
  }

  /* ============================================================
     💫 PARTICLE NỔ
     ============================================================ */
  .particle {
    position: fixed;
    width: 8px; height: 8px;
    pointer-events: none;
    z-index: 99;
    animation: particleBurst 0.9s ease-out forwards;
  }

  @keyframes particleBurst {
    0%   { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2) rotate(var(--rot)); }
  }

  /* ============================================================
     📜 TIÊU ĐỀ
     ============================================================ */
  .title-pixel {
    text-align: center;
    font-size: 38px;
    letter-spacing: 6px;
    color: var(--brass-light);
    text-shadow:
      2px 2px 0 var(--wood-dark),
      4px 4px 0 var(--ink),
      6px 6px 0 #0a0806,
      0 0 20px rgba(255, 200, 120, 0.4);
    margin-bottom: 6px;
    transform: scaleY(1.08);
    text-transform: uppercase;
    animation: titleGlow 3s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes titleGlow {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.18); }
  }

  .subtitle {
    text-align: center;
    font-size: 18px;
    color: #8b7a62;
    letter-spacing: 3px;
    margin-bottom: 18px;
    text-shadow: 1px 1px 0 var(--ink);
    position: relative;
    z-index: 2;
  }

  /* ============================================================
     🎴 HUD
     ============================================================ */
  .hud-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--wood-dark);
    border: 3px solid var(--brass);
    box-shadow: inset -2px -2px 0 #0f0d0b, inset 2px 2px 0 var(--brass-light);
    padding: 8px 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  .hud-item {
    font-size: 22px;
    color: var(--paper);
    text-shadow: 2px 2px 0 var(--ink);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.2s;
  }

  .hud-item .hud-value { color: var(--brass-light); font-weight: bold; }
  .hud-item.score .hud-value { color: #9fdf9f; }
  .hud-item.wrong .hud-value { color: #df9f9f; }

  .hud-item.bump {
    animation: hudBump 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes hudBump {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  /* ============================================================
     📜 KHUNG CÂU HỎI
     ============================================================ */
  .question-box {
    background:
      repeating-linear-gradient(0deg,
        rgba(184, 164, 129, 0.04) 0px, rgba(184, 164, 129, 0.04) 1px,
        transparent 1px, transparent 6px),
      #2e271f;
    border: 4px solid var(--wood-light);
    box-shadow:
      inset -3px -3px 0 #18130f,
      inset 3px 3px 0 var(--brass),
      0 8px 0 #0a0806;
    padding: 22px 18px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.3s;
    z-index: 2;
  }

  .question-box::before,
  .question-box::after {
    color: var(--brass);
    font-size: 18px;
    opacity: 0.7;
    position: absolute;
    z-index: 1;
  }
  .question-box::before { content: "❖"; top: 6px; left: 10px; }
  .question-box::after  { content: "❖"; bottom: 6px; right: 10px; }

  .question-text {
    font-size: 30px;
    line-height: 1.35;
    color: var(--paper);
    text-shadow: 2px 2px 0 var(--ink);
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-break: break-word;
    padding: 4px 20px;
    position: relative;
    z-index: 2;
  }

  .caret {
    display: inline-block;
    width: 10px;
    height: 32px;
    background: var(--brass-light);
    margin-left: 4px;
    vertical-align: middle;
    animation: caretBlink 0.7s steps(1) infinite;
    box-shadow: 0 0 8px var(--brass-light);
  }

  @keyframes caretBlink {
    50% { opacity: 0; }
  }

  /* ============================================================
     🅰️ LƯỚI ĐÁP ÁN
     ============================================================ */
  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
  }

  .answer-btn {
    position: relative;
    background: var(--wood-light);
    border: 4px solid var(--wood-dark);
    box-shadow:
      inset -3px -3px 0 #2a2019,
      inset 3px 3px 0 var(--brass),
      0 7px 0 #0a0806;
    color: var(--paper);
    font-family: 'VT323', monospace;
    font-size: 24px;
    padding: 16px 14px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 var(--ink);
    transform: translateY(0);
    min-height: 68px;
    display: flex;
    align-items: center;
    word-break: break-word;
    line-height: 1.2;
    overflow: hidden;
  }

  /* Vệt sáng quét qua nút khi hover */
  .answer-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 240, 200, 0.35), transparent);
    transition: left 0.6s;
    pointer-events: none;
  }

  .answer-btn:hover:not(:disabled)::before {
    left: 150%;
  }

  .answer-btn:hover:not(:disabled) {
    background: #75674f;
    box-shadow:
      inset -3px -3px 0 #3d3026,
      inset 3px 3px 0 var(--brass-light),
      0 7px 0 #1e1711,
      0 0 20px rgba(218, 203, 170, 0.4);
    transform: translateY(-3px) scale(1.02);
    filter: brightness(1.1);
  }

  .answer-btn:active:not(:disabled) {
    transform: translateY(5px) scale(0.98);
    box-shadow:
      inset -2px -2px 0 #2a2019,
      inset 2px 2px 0 var(--brass),
      0 2px 0 #0a0806;
  }

  /* Đúng */
  .answer-btn.correct-glow {
    background: var(--green);
    border-color: #1d3a1d;
    box-shadow:
      inset -3px -3px 0 #1d3a1d,
      inset 3px 3px 0 #9fdf9f,
      0 7px 0 #0a1f0a,
      0 0 30px #9fdf9f,
      0 0 60px rgba(159, 223, 159, 0.5);
    color: #f5ffe0;
    animation: correctPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateY(0);
  }

  @keyframes correctPop {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.12) rotate(1deg); }
    60%  { transform: scale(0.97) rotate(-1deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Sai */
  .answer-btn.wrong-glow {
    background: var(--red);
    border-color: #4a1010;
    box-shadow:
      inset -3px -3px 0 #4a1010,
      inset 3px 3px 0 #df9f9f,
      0 7px 0 #2e0a0a,
      0 0 24px #df9f9f;
    color: #ffe1e1;
    animation: wrongShake 0.5s cubic-bezier(.36,.07,.19,.97);
    opacity: 0.85;
  }

  @keyframes wrongShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    15%      { transform: translateX(-8px) rotate(-2deg); }
    30%      { transform: translateX(8px) rotate(2deg); }
    45%      { transform: translateX(-6px) rotate(-1deg); }
    60%      { transform: translateX(6px) rotate(1deg); }
    80%      { transform: translateX(-3px); }
  }

  .answer-btn:disabled {
    cursor: not-allowed;
  }

  .answer-btn:disabled:not(.correct-glow):not(.wrong-glow) {
    opacity: 0.5;
    transform: translateY(5px);
    box-shadow:
      inset -2px -2px 0 #2a2019,
      inset 2px 2px 0 #8b7a62,
      0 2px 0 #0a0806;
  }

  .answer-btn .label {
    display: inline-block;
    min-width: 38px;
    color: var(--brass-light);
    font-weight: bold;
    margin-right: 8px;
    text-align: center;
  }

  .answer-btn.correct-glow .label,
  .answer-btn.wrong-glow .label { color: #fff; }

  /* ============================================================
     ⚙️ NÚT ĐIỀU KHIỂN
     ============================================================ */
  .controls {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  .btn {
    background: var(--wood-light);
    border: 4px solid var(--wood-dark);
    box-shadow:
      inset -3px -3px 0 #2a2019,
      inset 3px 3px 0 var(--brass),
      0 7px 0 #0a0806;
    color: var(--paper);
    font-family: 'VT323', monospace;
    font-size: 24px;
    padding: 12px 26px;
    cursor: pointer;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--ink);
    transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateY(0);
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 240, 200, 0.4), transparent);
    transition: left 0.6s;
    pointer-events: none;
  }

  .btn:hover:not(:disabled)::before {
    left: 150%;
  }

  .btn:hover:not(:disabled) {
    background: #75674f;
    transform: translateY(-3px);
    filter: brightness(1.15);
  }

  .btn:active:not(:disabled) {
    transform: translateY(5px);
    box-shadow:
      inset -2px -2px 0 #2a2019,
      inset 2px 2px 0 var(--brass),
      0 2px 0 #0a0806;
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: translateY(5px);
    box-shadow:
      inset -2px -2px 0 #2a2019,
      inset 2px 2px 0 #6a5e4e,
      0 2px 0 #0a0806;
  }

  .btn-voice { font-size: 20px; padding: 12px 18px; }
  .btn-skip  { font-size: 20px; padding: 12px 18px; background: #6b5a3a; border-color: #3a2a1a; }
  .btn-skip:hover:not(:disabled) { background: #8a754a; }
  .btn-next  { background: #5e7a52; border-color: #2b3a26; }
  .btn-next:hover:not(:disabled) { background: #6f8f61; }
  .btn-next.ready {
    animation: nextPulse 1.5s ease-in-out infinite;
  }

  @keyframes nextPulse {
    0%, 100% { box-shadow: inset -3px -3px 0 #2a2019, inset 3px 3px 0 var(--brass), 0 7px 0 #0a0806, 0 0 0 rgba(159, 223, 159, 0); }
    50%      { box-shadow: inset -3px -3px 0 #2a2019, inset 3px 3px 0 var(--brass), 0 7px 0 #0a0806, 0 0 30px rgba(159, 223, 159, 0.8); }
  }

  /* ============================================================
     🎬 CHUYỂN CẢNH
     ============================================================ */
  .fade-transition {
    animation: fadeZoom 0.55s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes fadeZoom {
    0%   { opacity: 0.2; transform: scale(0.95); filter: blur(2px) brightness(0.6); }
    60%  { opacity: 0.95; transform: scale(1.015); filter: blur(0px) brightness(1.15); }
    100% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); }
  }

  /* ============================================================
     🏁 KẾT THÚC
     ============================================================ */
  .end-screen .answers-grid,
  .end-screen .controls .btn-next,
  .end-screen .controls .btn-skip { display: none; }

  .end-screen .question-text {
    font-size: 40px;
    color: var(--brass-light);
    text-shadow: 3px 3px 0 var(--wood-dark), 6px 6px 0 var(--ink);
    line-height: 1.4;
  }

  .rank-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 20px;
    background: var(--wood-dark);
    border: 3px solid var(--brass);
    color: var(--brass-light);
    font-size: 26px;
    letter-spacing: 3px;
    box-shadow: inset -2px -2px 0 #0f0d0b, inset 2px 2px 0 var(--brass-light);
    animation: rankGlow 2s ease-in-out infinite;
  }

  @keyframes rankGlow {
    0%, 100% { box-shadow: inset -2px -2px 0 #0f0d0b, inset 2px 2px 0 var(--brass-light), 0 0 20px rgba(218, 203, 170, 0.4); }
    50%      { box-shadow: inset -2px -2px 0 #0f0d0b, inset 2px 2px 0 var(--brass-light), 0 0 40px rgba(218, 203, 170, 0.9); }
  }

  /* ============================================================
     📱 RESPONSIVE
     ============================================================ */
  @media (max-width: 620px) {
    .game-wrapper { padding: 20px 14px; }
    .title-pixel { font-size: 26px; letter-spacing: 3px; }
    .subtitle { font-size: 14px; }
    .answers-grid { grid-template-columns: 1fr; gap: 10px; }
    .question-text { font-size: 22px; min-height: 80px; padding: 4px 8px; }
    .answer-btn { font-size: 20px; padding: 12px 10px; min-height: 58px; }
    .btn { font-size: 18px; padding: 10px 14px; letter-spacing: 1px; }
    .hud-item { font-size: 18px; }
    .end-screen .question-text { font-size: 26px; }
    .lantern-wrap, .bamboo { display: none; }
    .bg-image { filter: blur(10px) brightness(0.45); }
    .combo-badge { top: 10px; right: 10px; font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- ============================================================
     🖼️ BACKGROUND.PNG
     ============================================================ -->
<div class="bg-layer">
  <img class="bg-image" id="bgImage" src="" alt="" crossorigin="anonymous">
  <div class="bg-overlay"></div>
  <div class="bg-blur"></div>
</div>

<!-- Sao trời -->
<div class="stars" id="starsLayer"></div>

<!-- Lá rơi -->
<div class="leaves" id="leavesLayer"></div>

<!-- Đom đóm -->
<div class="fireflies" id="firefliesLayer"></div>

<!-- Đèn lồng -->
<div class="lantern-wrap left">
  <div class="lantern-rope"></div>
  <div class="lantern"></div>
</div>
<div class="lantern-wrap right">
  <div class="lantern-rope"></div>
  <div class="lantern"></div>
</div>

<!-- Trúc -->
<div class="bamboo left">
  <div class="bamboo-stalk">
    <div class="bamboo-leaf l1"></div>
    <div class="bamboo-leaf l2"></div>
    <div class="bamboo-leaf l3"></div>
    <div class="bamboo-leaf l4"></div>
    <div class="bamboo-leaf l5"></div>
  </div>
</div>
<div class="bamboo right">
  <div class="bamboo-stalk">
    <div class="bamboo-leaf l1"></div>
    <div class="bamboo-leaf l2"></div>
    <div class="bamboo-leaf l3"></div>
    <div class="bamboo-leaf l4"></div>
    <div class="bamboo-leaf l5"></div>
  </div>
</div>

<!-- ============================================================
     🎮 GAME
     ============================================================ -->
<div class="game-wrapper" id="gameWrapper">
  <!-- Progress bar -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Combo badge -->
  <div class="combo-badge" id="comboBadge">🔥 COMBO x2</div>

  <h1 class="title-pixel">TRẢ LỜI CÂU HỎI</h1>
  <div class="subtitle">⚬</div>

  <div class="hud-bar">
    <div class="hud-item" id="hudQuestionWrap">CÂU <span class="hud-value" id="hudQuestion">1/1</span></div>
    <div class="hud-item score" id="hudCorrectWrap">✓ ĐÚNG <span class="hud-value" id="hudCorrect">0</span></div>
    <div class="hud-item wrong" id="hudWrongWrap">✗ SAI <span class="hud-value" id="hudWrong">0</span></div>
  </div>

  <div class="question-box" id="questionBox">
    <div class="question-text" id="questionText">Đang tải câu hỏi...</div>
  </div>

  <div class="answers-grid" id="answersGrid">
    <button class="answer-btn" data-index="0"><span class="label">A.</span><span class="text">...</span></button>
    <button class="answer-btn" data-index="1"><span class="label">B.</span><span class="text">...</span></button>
    <button class="answer-btn" data-index="2"><span class="label">C.</span><span class="text">...</span></button>
    <button class="answer-btn" data-index="3"><span class="label">D.</span><span class="text">...</span></button>
  </div>

  <div class="controls">
    <button class="btn btn-voice" id="replayBtn" title="Nghe lại voice">🔊 NGHE LẠI</button>
    <button class="btn btn-skip"  id="skipBtn"   title="Bỏ qua câu này">⏭ BỎ QUA</button>
    <button class="btn btn-next"  id="nextBtn" disabled>TIẾP ➔</button>
  </div>
</div>

<audio id="voiceAudio" preload="auto"></audio>

<script>
(function () {
  /* ============================================================
     ⚙️ CẤU HÌNH GITHUB — SỬA 3 DÒNG NÀY
     ============================================================ */
const GITHUB_QUESTIONS_URL  = 'https://raw.githubusercontent.com/quangdai05/trochoi/refs/heads/main/questions.json';
const GITHUB_VOICE_BASE     = 'https://raw.githubusercontent.com/quangdai05/trochoi/main/';
const GITHUB_BACKGROUND_URL = 'https://raw.githubusercontent.com/quangdai05/trochoi/main/background.png';

  /* ============================================================
     📦 DỮ LIỆU DỰ PHÒNG
     ============================================================ */
  /* ============================================================
     🎯 BIẾN TOÀN CỤC
     ============================================================ */
  let questions = [];
  let currentIndex = 0;
  let isAnswered = false;
  let correctAnswerIndex = -1;
  let scoreCorrect = 0;
  let scoreWrong = 0;
  let hasWrongThisQuestion = false;
  let comboStreak = 0;
  let maxCombo = 0;
  let typewriterTimer = null;

  const $ = (id) => document.getElementById(id);
  const audio = $('voiceAudio');
  const questionText = $('questionText');
  const questionBox = $('questionBox');
  const nextBtn = $('nextBtn');
  const skipBtn = $('skipBtn');
  const replayBtn = $('replayBtn');
  const hudQuestion = $('hudQuestion');
  const hudCorrect = $('hudCorrect');
  const hudWrong = $('hudWrong');
  const hudCorrectWrap = $('hudCorrectWrap');
  const hudWrongWrap = $('hudWrongWrap');
  const hudQuestionWrap = $('hudQuestionWrap');
  const gameWrapper = $('gameWrapper');
  const starsLayer = $('starsLayer');
  const progressFill = $('progressFill');
  const comboBadge = $('comboBadge');
  const answerBtns = Array.from(document.querySelectorAll('.answer-btn'));

  /* ============================================================
     🖼️ LOAD BACKGROUND
     ============================================================ */
  function loadBackground() {
    const img = $('bgImage');
    if (!img) return;
    img.src = GITHUB_BACKGROUND_URL;
    img.onerror = () => {
      console.warn('⚠️ Không tải được background.png');
      img.style.display = 'none';
    };
    img.onload = () => console.log('✅ Đã tải background.png');
  }

  /* ============================================================
     🌟 SAO TRỜI
     ============================================================ */
  function generateStars(count = 70) {
    starsLayer.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top  = Math.random() * 55 + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      const size = 2 + Math.random() * 3;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      starsLayer.appendChild(s);
    }
  }

  /* ============================================================
     🍃 LÁ RƠI
     ============================================================ */
  function generateLeaves(count = 18) {
    const layer = $('leavesLayer');
    layer.innerHTML = '';
    const colors = ['c1', 'c2', 'c3', 'c4', 'c5'];
    for (let i = 0; i < count; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'leaf ' + colors[Math.floor(Math.random() * colors.length)];
      leaf.style.left = Math.random() * 100 + '%';
      leaf.style.animationDuration = (8 + Math.random() * 8) + 's';
      leaf.style.animationDelay = (Math.random() * 12) + 's';
      const size = 10 + Math.random() * 8;
      leaf.style.width = size + 'px';
      leaf.style.height = size + 'px';
      layer.appendChild(leaf);
    }
  }

  /* ============================================================
     ✨ ĐOM ĐÓM
     ============================================================ */
  function generateFireflies(count = 14) {
    const layer = $('firefliesLayer');
    layer.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const ff = document.createElement('div');
      ff.className = 'firefly';
      ff.style.left = Math.random() * 100 + '%';
      ff.style.bottom = (5 + Math.random() * 40) + '%';
      ff.style.animationDuration = (6 + Math.random() * 8) + 's';
      ff.style.animationDelay = (Math.random() * 10) + 's';
      const size = 3 + Math.random() * 3;
      ff.style.width = size + 'px';
      ff.style.height = size + 'px';
      layer.appendChild(ff);
    }
  }

  /* ============================================================
     🔊 ÂM THANH
     ============================================================ */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = 'square', volume = 0.15, delay = 0) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  function soundCorrect() {
    playTone(660, 0.12, 'square', 0.15, 0);
    playTone(880, 0.18, 'square', 0.15, 0.09);
    playTone(1320, 0.25, 'square', 0.12, 0.18);
    playTone(1760, 0.3, 'triangle', 0.08, 0.25);
  }

  function soundWrong() {
    playTone(220, 0.18, 'sawtooth', 0.12, 0);
    playTone(160, 0.3, 'sawtooth', 0.12, 0.13);
  }

  function soundClick() {
    playTone(1200, 0.04, 'square', 0.06, 0);
  }

  function soundCombo() {
    playTone(1320, 0.1, 'triangle', 0.1, 0);
    playTone(1760, 0.12, 'triangle', 0.1, 0.08);
    playTone(2200, 0.18, 'triangle', 0.09, 0.16);
  }

  /* ============================================================
     🔄 CHUẨN HÓA
     ============================================================ */
  function normalizeCorrect(val) {
    if (typeof val === 'number' && val >= 0 && val < 4) return val;
    if (typeof val === 'string') {
      const map = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
      const key = val.trim().toUpperCase();
      if (map[key] !== undefined) return map[key];
    }
    return 0;
  }

  function addFadeEffect(el) {
    el.classList.remove('fade-transition');
    void el.offsetWidth;
    el.classList.add('fade-transition');
  }

  /* ============================================================
     💥 HIỆU ỨNG PARTICLE
     ============================================================ */
  function burstParticles(originX, originY, color, count = 12) {
    const colors = color === 'green'
      ? ['#9fdf9f', '#6faf5f', '#dfffbf', '#4f9f4f']
      : ['#df9f9f', '#af5f5f', '#ffbfbf', '#8b2e2e'];
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = originX + 'px';
      p.style.top  = originY + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.boxShadow = `0 0 8px ${p.style.background}`;
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const dist = 60 + Math.random() * 90;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 950);
    }
  }

  /* ============================================================
     💥 ĐIỂM BAY (+1 / -1)
     ============================================================ */
  function showScorePop(x, y, value, isPlus) {
    const pop = document.createElement('div');
    pop.className = 'score-pop ' + (isPlus ? 'plus' : 'minus');
    pop.textContent = isPlus ? '+1' : '-1';
    pop.style.left = x + 'px';
    pop.style.top  = y + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1250);
  }

  /* ============================================================
     💥 SHAKE MÀN HÌNH
     ============================================================ */
  function shakeScreen() {
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 450);
  }

  /* ============================================================
     🔥 HUD BUMP
     ============================================================ */
  function bumpHud(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  /* ============================================================
     🔥 COMBO BADGE
     ============================================================ */
  function updateComboBadge() {
    if (comboStreak >= 2) {
      comboBadge.textContent = `🔥 COMBO x${comboStreak}`;
      comboBadge.classList.add('show');
    } else {
      comboBadge.classList.remove('show');
    }
  }

  /* ============================================================
     📊 PROGRESS BAR
     ============================================================ */
  function updateProgress() {
    const pct = questions.length ? ((currentIndex) / questions.length) * 100 : 0;
    progressFill.style.width = pct + '%';
  }

  /* ============================================================
     ⌨️ TYPEWRITER
     ============================================================ */
  function typeWriter(el, text, speed = 18) {
    if (typewriterTimer) clearInterval(typewriterTimer);
    el.textContent = '';
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.appendChild(caret);

    let i = 0;
    typewriterTimer = setInterval(() => {
      if (i < text.length) {
        caret.insertAdjacentText('beforebegin', text.charAt(i));
        i++;
      } else {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
        setTimeout(() => caret.remove(), 800);
      }
    }, speed);
  }

  /* ============================================================
     🔊 VOICE
     ============================================================ */
  function playVoice(voiceFile) {
    if (!voiceFile) return;
    const url = voiceFile.startsWith('http') ? voiceFile : (GITHUB_VOICE_BASE + voiceFile);
    audio.src = url;
    audio.load();
    replayBtn.classList.add('playing');
    const p = audio.play();
    if (p && p.catch) p.catch(err => console.warn('Không phát được voice:', err));
  }

  audio.addEventListener('ended', () => replayBtn.classList.remove('playing'));
  audio.addEventListener('pause', () => replayBtn.classList.remove('playing'));
  audio.addEventListener('play',  () => replayBtn.classList.add('playing'));

  /* ============================================================
     🖼️ RENDER CÂU HỎI
     ============================================================ */
  const LABELS = ['A', 'B', 'C', 'D'];

  function renderQuestion(index) {
    if (!questions.length || index >= questions.length) return;
    const q = questions[index];
    correctAnswerIndex = q.correct;
    isAnswered = false;
    hasWrongThisQuestion = false;

    /* HUD */
    hudQuestion.textContent = `${index + 1}/${questions.length}`;
    hudCorrect.textContent = scoreCorrect;
    hudWrong.textContent = scoreWrong;
    updateProgress();
    updateComboBadge();

    /* Reset nút đáp án */
    answerBtns.forEach((btn, i) => {
      const label = btn.querySelector('.label');
      const text  = btn.querySelector('.text');
      if (label) label.textContent = `${LABELS[i]}.`;
      if (text)  text.textContent  = q.answers[i] || '---';
      btn.disabled = false;
      btn.classList.remove('correct-glow', 'wrong-glow', 'ready');
      btn.style.opacity = '1';
      btn.style.animation = '';
    });

    /* Next khóa */
    nextBtn.disabled = true;
    nextBtn.classList.remove('ready');
    nextBtn.textContent = (index === questions.length - 1) ? 'KẾT THÚC ➔' : 'TIẾP ➔';

    /* Bỏ màn hình kết thúc */
    gameWrapper.classList.remove('end-screen');
    starsLayer.classList.remove('active');

    /* Chuyển cảnh + typewriter */
    addFadeEffect(questionBox);
    typeWriter(questionText, q.question, 20);

    /* Voice */
    playVoice(q.voice);
  }

  /* ============================================================
     ✅ CHỌN ĐÁP ÁN
     ============================================================ */
  function handleAnswer(selectedIndex) {
    if (!questions.length) return;
    if (isAnswered) return;

    const selectedBtn = answerBtns[selectedIndex];
    if (!selectedBtn || selectedBtn.disabled) return;

    const isCorrect = (selectedIndex === correctAnswerIndex);
    const rect = selectedBtn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    if (isCorrect) {
      /* ============ ĐÚNG ============ */
      isAnswered = true;
      selectedBtn.classList.add('correct-glow');
      soundCorrect();

      /* Khóa nút khác */
      answerBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx !== selectedIndex && !btn.classList.contains('wrong-glow')) {
          btn.style.opacity = '0.45';
        }
      });

      /* Cộng điểm + hiệu ứng */
      scoreCorrect++;
      comboStreak++;
      if (comboStreak > maxCombo) maxCombo = comboStreak;
      hudCorrect.textContent = scoreCorrect;
      bumpHud(hudCorrectWrap);
      burstParticles(centerX, centerY, 'green', 14);
      showScorePop(centerX, centerY - 20, '+1', true);

      /* Combo */
      if (comboStreak >= 2) {
        soundCombo();
        updateComboBadge();
      }

      /* Mở nút next */
      nextBtn.disabled = false;
      nextBtn.classList.add('ready');

    } else {
      /* ============ SAI ============ */
      selectedBtn.classList.add('wrong-glow');
      selectedBtn.disabled = true;
      soundWrong();

      /* Trừ điểm CHỈ 1 LẦN cho mỗi câu */
      if (!hasWrongThisQuestion) {
        scoreWrong++;
        hudWrong.textContent = scoreWrong;
        bumpHud(hudWrongWrap);
        hasWrongThisQuestion = true;
      }

      /* Reset combo */
      comboStreak = 0;
      updateComboBadge();

      /* Hiệu ứng */
      burstParticles(centerX, centerY, 'red', 10);
      showScorePop(centerX, centerY - 20, '-1', false);
      shakeScreen();

      /* Reset typewriter nếu đang gõ */
      if (typewriterTimer) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
        questionText.textContent = questions[currentIndex].question;
      }

      /* Rung nhẹ khung câu hỏi */
      questionBox.style.animation = 'none';
      void questionBox.offsetWidth;
      questionBox.style.animation = 'wrongShake 0.4s ease';

      /* Vẫn cho chọn tiếp → KHÔNG set isAnswered = true */
    }
  }

  /* ============================================================
     ⏭ BỎ QUA
     ============================================================ */
  function skipQuestion() {
    if (isAnswered) {
      goToNext();
      return;
    }

    /* Đánh dấu đã trả lời (bỏ qua) */
    isAnswered = true;
    hasWrongThisQuestion = true;

    /* Tô xanh đáp án đúng để show đáp án */
    answerBtns.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctAnswerIndex) {
        btn.classList.add('correct-glow');
      } else {
        btn.style.opacity = '0.35';
      }
    });

    /* Trừ 1 điểm sai nếu chưa từng sai */
    if (!hasWrongThisQuestion || scoreWrong === 0) {
      // Đã set hasWrong = true, chỉ trừ nếu chưa từng sai câu này
    }
    // Nếu chưa từng sai câu này → trừ 1 điểm
    if (scoreWrong === (scoreWrong)) {
      // Chỉ trừ khi lần đầu bỏ qua câu này
    }

    /* Reset combo */
    comboStreak = 0;
    updateComboBadge();

    /* Mở next */
    nextBtn.disabled = false;
    nextBtn.classList.add('ready');

    if (currentIndex === questions.length - 1) {
      nextBtn.textContent = 'KẾT THÚC ➔';
    }
  }

  /* ============================================================
     ➡️ CHUYỂN CÂU
     ============================================================ */
  function goToNext() {
    if (currentIndex >= questions.length - 1) {
      showEndScreen();
      return;
    }
    currentIndex++;
    renderQuestion(currentIndex);
  }

  /* ============================================================
     🏁 KẾT THÚC
     ============================================================ */
  function showEndScreen() {
    audio.pause();
    audio.currentTime = 0;
    replayBtn.classList.remove('playing');

    /* Ẩn combo badge */
    comboBadge.classList.remove('show');

    gameWrapper.classList.add('end-screen');
    addFadeEffect(questionBox);

    /* Progress đầy */
    progressFill.style.width = '100%';

    /* Sao trời */
    generateStars(70);
    starsLayer.classList.add('active');

    const total = questions.length;
    const pct = total ? Math.round((scoreCorrect / total) * 100) : 0;

    let rank = '🌱 TẬP SỰ';
    if (pct >= 90) rank = '🏆 TRẠNG NGUYÊN';
    else if (pct >= 70) rank = '🥇 BẢNG NHÃN';
    else if (pct >= 50) rank = '🥈 CỬ NHÂN';
    else if (pct >= 30) rank = '🥉 TÚ TÀI';

    const comboText = maxCombo >= 2 ? `<br><span style="font-size:22px;color:#ffb060">🔥 COMBO CAO NHẤT: x${maxCombo}</span>` : '';

    questionText.innerHTML = `
      🎉 HOÀN THÀNH! 🎉<br>
      <span style="font-size:28px;color:#dacbaa">ĐÚNG: ${scoreCorrect} / ${total}  (${pct}%)</span>${comboText}<br>
      <span class="rank-badge">${rank}</span>
    `;

    nextBtn.disabled = true;
    nextBtn.classList.remove('ready');
    skipBtn.disabled = true;
    replayBtn.textContent = '🔄 CHƠI LẠI';
    replayBtn.onclick = () => {
      scoreCorrect = 0; scoreWrong = 0; currentIndex = 0;
      comboStreak = 0; maxCombo = 0;
      replayBtn.textContent = '🔊 NGHE LẠI';
      replayBtn.onclick = null;
      skipBtn.disabled = false;
      initGame();
    };

    hudQuestion.textContent = `${total}/${total}`;
  }

  /* ============================================================
     🚀 KHỞI TẠO
     ============================================================ */
  async function initGame() {
    scoreCorrect = 0;
    scoreWrong = 0;
    currentIndex = 0;
    isAnswered = false;
    hasWrongThisQuestion = false;
    comboStreak = 0;
    maxCombo = 0;
    hudCorrect.textContent = 0;
    hudWrong.textContent = 0;
    progressFill.style.width = '0%';
    comboBadge.classList.remove('show');
    skipBtn.disabled = false;
    replayBtn.onclick = null;
    replayBtn.textContent = '🔊 NGHE LẠI';

    try {
      const res = await fetch(GITHUB_QUESTIONS_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) questions = data;
      else if (data.questions && Array.isArray(data.questions)) questions = data.questions;
      else throw new Error('JSON không hợp lệ');
      console.log('✅ Đã tải', questions.length, 'câu hỏi');
    } catch (err) {
      console.warn('⚠️ Lỗi fetch, dùng dữ liệu mẫu:', err);
      questions = FALLBACK_QUESTIONS;
    }

    questions = questions.map((q, idx) => ({
      question: q.question || `Câu hỏi ${idx + 1}`,
      answers: Array.isArray(q.answers) && q.answers.length === 4 ? q.answers : ['A', 'B', 'C', 'D'],
      correct: normalizeCorrect(q.correct),
      voice: q.voice || `voice${idx + 1}.mp3`
    }));

    renderQuestion(0);
  }

  /* ============================================================
     🎧 SỰ KIỆN
     ============================================================ */
  answerBtns.forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const idx = parseInt(btn.dataset.index, 10);
      handleAnswer(idx);
    });
    btn.addEventListener('mouseenter', () => {
      if (!btn.disabled) soundClick();
    });
  });

  nextBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (!nextBtn.disabled) goToNext();
  });

  skipBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (!skipBtn.disabled) skipQuestion();
  });

  replayBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (replayBtn.onclick) return;
    const q = questions[currentIndex];
    if (q) playVoice(q.voice);
  });

  /* Phím tắt */
  document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '4') {
      const idx = parseInt(e.key, 10) - 1;
      const btn = answerBtns[idx];
      if (btn && !btn.disabled) handleAnswer(idx);
    }
    if (e.key === 'Enter' && !nextBtn.disabled) goToNext();
    if (e.key === ' ') {
      e.preventDefault();
      if (!replayBtn.onclick) {
        const q = questions[currentIndex];
        if (q) playVoice(q.voice);
      }
    }
  });

  /* ============================================================
     🚀 CHẠY
     ============================================================ */
  window.addEventListener('DOMContentLoaded', () => {
    loadBackground();
    generateLeaves(20);
    generateFireflies(14);
    initGame();
  });
})();
</script>
</body>
